name: Automatic contribution screening

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'data/records.json'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: atlas-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screen:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted Atlas controls
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Read only the proposed data file
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/atlas-pr-${PR_NUMBER}"
          git show "refs/remotes/origin/atlas-pr-${PR_NUMBER}:data/records.json" > "$RUNNER_TEMP/candidate-records.json"
          git diff --name-only HEAD "refs/remotes/origin/atlas-pr-${PR_NUMBER}" > "$RUNNER_TEMP/changed-files.txt"

      - name: Screen structure, duplicates, status and official sources
        id: review
        continue-on-error: true
        run: |
          set +e
          python scripts/review_contribution.py \
            --base data/records.json \
            --candidate "$RUNNER_TEMP/candidate-records.json" \
            --changed-files "$RUNNER_TEMP/changed-files.txt" \
            --report-json "$RUNNER_TEMP/atlas-review.json" \
            --report-markdown "$RUNNER_TEMP/atlas-review.md"
          status=$?
          if [ "$status" -eq 0 ]; then echo "eligible=true" >> "$GITHUB_OUTPUT"; else echo "eligible=false" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Report the screening result
        uses: actions/github-script@v9
        env:
          ELIGIBLE: ${{ steps.review.outputs.eligible }}
          REPORT_PATH: ${{ runner.temp }}/atlas-review.md
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const eligible = process.env.ELIGIBLE === 'true';
            const trustedAutomation =
              context.payload.pull_request.head.repo.full_name === `${owner}/${repo}` &&
              context.payload.pull_request.head.ref.startsWith('agent/daily-atlas-');
            const marker = '<!-- atlas-automatic-review -->';
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const body = `${marker}\n${report}`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
            const wanted = eligible
              ? (trustedAutomation ? 'atlas:automation-checks-passed' : 'atlas:checks-passed')
              : 'atlas:needs-attention';
            const unwanted = eligible
              ? ['atlas:needs-attention', trustedAutomation ? 'atlas:checks-passed' : 'atlas:automation-checks-passed']
              : ['atlas:checks-passed', 'atlas:automation-checks-passed'];
            const wantedDescription = eligible
              ? (trustedAutomation
                ? 'Vertrouwde Atlas-actualisator; automatische controles geslaagd'
                : 'Automatische controles geslaagd; menselijke beoordeling vereist')
              : 'Aanvulling nodig voor beoordeling';
            try {
              await github.rest.issues.getLabel({ owner, repo, name: wanted });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: wanted,
                color: eligible ? '1A7F37' : 'D4A72C',
                description: wantedDescription
              });
            }
            for (const label of unwanted) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [wanted] });
            if (eligible) {
              const decision = trustedAutomation
                ? 'De automatische controles zijn geslaagd. De door de eigenaar gemachtigde dagelijkse Atlas-actualisator mag deze eigen PR mergen zodra ook alle overige verplichte checks groen zijn.'
                : 'De automatische controles zijn geslaagd. Een mens moet deze externe bijdrage nog beoordelen en mergen; er is niets automatisch gepubliceerd.';
              await github.rest.issues.createComment({ owner, repo, issue_number, body: decision });
            }

      - name: Mark an unresolved contribution as failed
        if: ${{ steps.review.outputs.eligible != 'true' }}
        run: exit 1
