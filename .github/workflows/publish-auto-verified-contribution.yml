name: Publish fully verified Atlas submission

on:
  workflow_run:
    workflows: [Validate contribution, Atlas quality gate]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: atlas-submission-publication-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'codex/inzending-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      checks: read
      statuses: read
    steps:
      - name: Check out trusted publication controls, never candidate code
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify both exact-commit checks, merge the bot PR and request deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_submission.py publish
