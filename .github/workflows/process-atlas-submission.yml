name: Review Atlas submission

on:
  issues:
    types: [opened, edited, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open Atlas submission to check against current main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: atlas-submission-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.state == 'open' &&
       contains(github.event.issue.labels.*.name, 'atlas-aanvulling') &&
       (github.event.action != 'labeled' || github.event.label.name == 'atlas-aanvulling'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Admit only source-proven additions and request independent validation
        env:
          GH_TOKEN: ${{ github.token }}
          ATLAS_SUBMISSION_ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
        run: python scripts/publish_submission.py prepare
