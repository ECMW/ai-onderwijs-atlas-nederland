name: Daily Atlas maintenance review

on:
  schedule:
    - cron: '17 6 * * *'
    - cron: '17 11,16 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: atlas-daily-maintenance
  cancel-in-progress: false

jobs:
  refresh-papers:
    if: github.ref == 'refs/heads/main' && github.event.schedule == '17 6 * * *'
    runs-on: ubuntu-latest
    permissions: {actions: write}
    steps:
      - name: Refresh the papers through the protected Pages publication
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'deploy-pages.yml', ref: 'main', inputs: {refresh_papers: 'true'}
            });
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Restore discovery state
        uses: actions/cache/restore@v6
        with:
          path: discovery-state
          key: atlas-discovery-${{ github.run_id }}
          restore-keys: atlas-discovery-

      - name: Restore last known maintenance state
        uses: actions/cache/restore@v6
        with:
          path: maintenance-state
          key: atlas-maintenance-${{ github.run_id }}
          restore-keys: atlas-maintenance-

      - name: Detect, compare and prepare review proposals
        run: python scripts/run_daily_maintenance.py

      - name: Discover and strictly verify concrete official content
        run: >-
          python scripts/discover_official_content.py --root .
          --maintenance-state maintenance-state/state.json
          --events maintenance-output/events.json
          --state discovery-state/state.json --output-dir discovery-output
          --max-visits 12 --max-approved 3

      - name: Request independent protected intake for proven discoveries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_discovery.py

      - name: Save discovery state
        uses: actions/cache/save@v6
        with:
          path: discovery-state
          key: atlas-discovery-${{ github.run_id }}

      - name: Prepare the research summary and discovery queue
        run: python scripts/maintenance_summary.py

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: atlas-maintenance-${{ github.run_id }}
          if-no-files-found: error
          path: |
            maintenance-output
            discovery-output
          retention-days: 30

      - name: Save last known maintenance state
        uses: actions/cache/save@v6
        with:
          path: maintenance-state
          key: atlas-maintenance-${{ github.run_id }}
